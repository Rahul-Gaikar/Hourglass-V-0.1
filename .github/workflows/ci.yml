name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: xcrun swift-format lint --strict --recursive Hourglass HourglassTests

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          # Pick any available iPhone simulator so CI doesn't break when the runner's Xcode changes.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $DEVICE_ID"
          xcodebuild test \
            -project Hourglass.xcodeproj \
            -scheme Hourglass \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
