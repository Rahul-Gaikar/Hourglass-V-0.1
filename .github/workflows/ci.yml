name: CI

on:
  # Branch pushes are covered by their pull request; avoid running everything twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Liquid Glass needs the iOS 26 SDK. Pick the newest stable Xcode 26.x on the runner.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No stable Xcode 26 found on this runner"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: xcrun swift-format lint --strict --recursive Hourglass HourglassTests HourglassWidgets Shared

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          # Pick any available iOS 26+ iPhone simulator so CI doesn't break when the runner image changes.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def ios_major(runtime):
              match = re.search(r"iOS-(\d+)", runtime)
              return int(match.group(1)) if match else 0
          print(next(d["udid"] for runtime, ds in devices.items() if ios_major(runtime) >= 26
                     for d in ds if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project Hourglass.xcodeproj \
            -scheme Hourglass \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Launch the app on its own before testing. If it hangs on launch, the test run would sit silent
      # until the job times out; this shows where its main thread is stuck instead.
      - name: Launch the app and screenshot it
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Hourglass.app
          # Prints "app.hourglass.Hourglass: <pid>".
          PID=$(xcrun simctl launch "$DEVICE_ID" app.hourglass.Hourglass | awk '{print $2}')
          echo "Launched with pid $PID"
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot hourglass.png
          if kill -0 "$PID" 2>/dev/null; then
            echo "Main thread after 15 s (a healthy app is idle in its run loop):"
            sample "$PID" 2 -mayDie 2>&1 | sed -n '/Call graph/,/Total number in stack/p' | head -60
          else
            echo "::error::The app exited within 15 s of launch"
            exit 1
          fi
          xcrun simctl terminate "$DEVICE_ID" app.hourglass.Hourglass || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourglass-screenshot
          path: hourglass.png
          if-no-files-found: warn

      - name: Test
        # Well above a normal run (~3 min), so a hang fails here rather than at the job limit.
        timeout-minutes: 15
        run: |
          xcodebuild test-without-building \
            -project Hourglass.xcodeproj \
            -scheme Hourglass \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
